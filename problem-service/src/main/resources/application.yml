server:
  port: 8102

spring:
  application:
    name: problem-service
  datasource:
    url: jdbc:mysql://localhost:3306/mini_judge?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: root
    # 密码走环境变量（本地开发请设置 SPRING_DATASOURCE_PASSWORD）
    password: ${SPRING_DATASOURCE_PASSWORD:changeme}
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
  cloud:
    nacos:
      server-addr: localhost:8848
      discovery:
        namespace: mini-judge

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

mini-judge:
  problem:
    # 用例文件根目录（管理接口落盘位置）。相对路径按进程工作目录解析：
    # 本地冒烟从模块目录启动 -> problem-service/cases/{problemId}/；
    # docker 部署固定共享卷 /data/cases，与 judge-service 的 sandbox.cases-root 同路径。
    # 生产演进：对象存储 + 预签名直传（见 ProblemAdminController 类注释）。
    cases-root: cases
