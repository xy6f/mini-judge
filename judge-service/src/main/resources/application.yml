server:
  port: 8103

spring:
  application:
    name: judge-service
  datasource:
    url: jdbc:mysql://localhost:3306/mini_judge?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: root
    # 密码走环境变量（本地开发请设置 SPRING_DATASOURCE_PASSWORD）
    password: ${SPRING_DATASOURCE_PASSWORD:changeme}
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
  cloud:
    nacos:
      server-addr: localhost:8848
      discovery:
        namespace: mini-judge

# Feign：评测内部调用，超时给足但必须显式设置（默认超时策略在不同版本会变，显式=可预期）
spring.cloud.openfeign:
  client:
    config:
      problem-service:
        connect-timeout: 2000
        read-timeout: 5000
      # rejudge 前的角色现查是"用户在线等待"路径，超时必须短——
      # 宁可快速失败（fail-closed 拒绝），不能让管理接口挂 10 秒
      user-service:
        connect-timeout: 1000
        read-timeout: 3000

mini-judge:
  judge:
    # worker 并行度：默认按 4 演示；Linux 评测机上=核数（计划书 7.2）
    concurrency: 4
    # 提交工作目录根：每条提交 {work-root}/{submissionId}/ 存源码与编译产物，判完即焚
    work-root: work
    # 失败短路策略：true=首个失败用例即停（省算力，默认）；false=跑完全部用例得逐例详情
    fail-fast: true
    # 编译阶段超时（毫秒）：与用户代码运行时限分开——恶意源码可让 javac 高负载，必须独立设限
    compile-timeout-ms: 15000
    # 看门狗阈值：RUNNING 超过 N 分钟认定"执行者丢失"置 REQUEUE（进程级超时的最后一层兜底）
    watchdog-timeout-minutes: 5
    # 调试开关：true=判完保留工作目录（翻 stdout 日志排查 WA），生产必须 false 防磁盘涨
    keep-work-dir: false
  problem-service:
    # Feign 地址开关：空=按服务名走 Nacos 发现（生产形态）；
    # local profile 填 http://localhost:8102 直连（无注册中心冒烟）
    url: ""
  user-service:
    # 角色现查（rejudge RBAC 收口）的地址开关，语义同上：
    # 空=走 user-service 服务发现；local profile 填 http://localhost:8101 直连
    url: ""
  sandbox:
    # docker=生产（五层容器护栏）；simulate=本机 JDK 直跑，仅限开发演示，无安全护栏
    mode: docker
    java-image: judge-java:latest
    # 用例文件根目录：单机 compose 部署时 problem-service 与 judge-service 共享该卷
    cases-root: /data/cases

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
